<table class="table table-striped border">
	<thead>
		<tr>
			<th scope="col">Id</th>
			<th scope="col">Fecha</th>
			<th scope="col">Cuenta</th>
			<th scope="col">Número</th>
			<th scope="col">Monto</th>
			<th scope="col">Franquicia</th>
			<th scope="col">Tipo</th>
		</tr>
	</thead>
	<tbody>
		@for (finance of finances; track finance) {
			<tr>
				<th scope="row">{{ finance.id }}</th>
				<td>{{ finance.date }}</td>
				<td>{{ finance.accountName }}</td>
				<td>{{ finance.accountNumber }}</td>
				<td>{{ finance.amount }} {{ finance.currency }}</td>
				<td>{{ finance.issuer }}</td>
				<td>
					<dsb-badge-atom
						[text]="finance.type"
						[type]="typeMap[finance.type]" >
                    </dsb-badge-atom>
				</td>
			</tr>
		}
	</tbody>
</table>
