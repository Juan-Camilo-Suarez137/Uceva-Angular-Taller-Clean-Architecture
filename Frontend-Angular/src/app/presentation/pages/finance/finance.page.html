@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Finanzas..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar las Finanzas" ></app-alert>
    }

    @case('success'){
        <app-finance-table [finances]="finances" ></app-finance-table>
    }

}
