@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Artículos Comerciales..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Artículos Comerciales" ></app-alert>
    }

    @case('success'){
        <app-commerce-table [commerceList]="commerceList" ></app-commerce-table>
    }

}
